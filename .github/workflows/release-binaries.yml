name: release-binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            asset: noldor-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: noldor-linux-arm64
          - runner: macos-13
            asset: noldor-darwin-amd64
          - runner: macos-14
            asset: noldor-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: read bun floor
        id: floor
        run: |
          V="$(node -e "const m=require('fs').readFileSync('src/binary/bun-floor.ts','utf8').match(/BUN_FLOOR = '([^']+)'/); if(!m) process.exit(1); console.log(m[1])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.floor.outputs.version }}
      - name: build host-target binary
        run: pnpm build:binary --outfile=out/${{ matrix.asset }}
      - name: native smoke
        run: scripts/smoke-binary.sh out/${{ matrix.asset }} "$(node -p "require('./package.json').version")"
      - name: record reported version
        run: out/${{ matrix.asset }} --version > out/${{ matrix.asset }}.version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}
            out/${{ matrix.asset }}.version
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: version guard — tag == package.json == every binary
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          [ "$TAG_VERSION" = "$PKG_VERSION" ] || { echo "tag v$TAG_VERSION != package.json $PKG_VERSION" >&2; exit 1; }
          ls assets/*.version >/dev/null || { echo "no version records downloaded" >&2; exit 1; }
          for vf in assets/*.version; do
            BV="$(tr -dc '0-9.' < "$vf")"
            [ "$BV" = "$PKG_VERSION" ] || { echo "$vf reports '$BV' != $PKG_VERSION" >&2; exit 1; }
          done
      - name: checksums + notices
        run: |
          node bin/generate-notices.mjs
          cd assets && sha256sum noldor-linux-amd64 noldor-linux-arm64 noldor-darwin-amd64 noldor-darwin-arm64 > SHA256SUMS
      - name: upload — binaries first, sentinel last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          for b in noldor-linux-amd64 noldor-linux-arm64 noldor-darwin-amd64 noldor-darwin-arm64; do
            gh release upload "$GITHUB_REF_NAME" "assets/$b" --clobber
          done
          gh release upload "$GITHUB_REF_NAME" THIRD_PARTY_NOTICES.txt --clobber
          gh release upload "$GITHUB_REF_NAME" assets/SHA256SUMS --clobber
